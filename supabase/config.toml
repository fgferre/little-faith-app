project_id = "little-faith-app"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
redirect_uri = ""

[storage]
enabled = true
file_size_limit = "10MiB"

# A função valida a sessão sozinha (middleware); o cartão do participante (POST /v1/participant_card) é público por desenho.
[functions.api]
enabled = true
verify_jwt = false
entrypoint = "./functions/api/index.ts"

# This single-purpose entry point validates its own private scheduler capability.
# No schedule is installed by this configuration.
[functions.results-collector]
enabled = true
verify_jwt = false
entrypoint = "./functions/results-collector/index.ts"
import_map = "./functions/api/deno.json"
